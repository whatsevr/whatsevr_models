name: whatsevr_api
description: "Whatsevr wire contract: the API client generated from the server's OpenAPI document, plus the hand-written models the API does not describe."
version: 0.0.1
homepage: https://whatsevr.com

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The generated client (lib/src/api, lib/src/model) needs these three.
  dio: ^5.11.0
  copy_with_extension: ^17.0.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  copy_with_extension_gen: ^17.0.0
  freezed: ^3.1.0
  json_serializable: ^6.8.0
